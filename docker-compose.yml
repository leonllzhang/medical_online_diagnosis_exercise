services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medlink_exam
      POSTGRES_USER: medlink
      POSTGRES_PASSWORD: ${DB_PASSWORD:-medlink_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medlink -d medlink_exam"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://medlink:${DB_PASSWORD:-medlink_pass}@db:5432/medlink_exam"
      JWT_SECRET: ${JWT_SECRET:-medlink-exam-jwt-secret}
      PASS_THRESHOLD: ${PASS_THRESHOLD:-80}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
